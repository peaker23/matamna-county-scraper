name: Daily county scrape

on:
  # Runs twice a day: 10am and 6pm Chicago time (2026-11-16: fewer runs to stay inside the 2,000 free Actions
  # minutes a month). Each slot has a CDT and a CST entry; the script skips the one that lands outside the slot.
  schedule:
    - cron: "3 15,16 * * *"
    - cron: "3 23,0 * * *"
  # "Fetch now" button in the County Leads app (and the Run workflow button on GitHub).
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the scheduled hours"
        default: "true"
      days_back:
        description: "Extra days to look back (0 = since last successful run)"
        default: "0"
      budget_min:
        description: "Minutes of scraping before it stops (40 = normal; up to 320 to clear a backlog in one run)"
        default: "40"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned: ubuntu-latest moved to Ubuntu 26 in Oct 2026 and its package mirrors failed on 2026-11-11 (run #34).
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check the time slot (before installing anything)
        id: slot
        # Scheduled runs: GitHub fires two cron entries per slot (summer / winter time); only the one that lands in a
        # Chicago slot (10am, 6pm, up to 75 min late) goes on. The others stop here in a few seconds
        # instead of after the 3-minute install. "Fetch now" / Run workflow always goes on.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          h=$(TZ=America/Chicago date +%H); mi=$(TZ=America/Chicago date +%M); m=$((10#$h * 60 + 10#$mi)); run=false
          for s in 600 1080; do d=$((m - s)); if [ $d -ge 0 ] && [ $d -le 45 ]; then run=true; fi; done   # 10am, 6pm (45 min: the other time-zone entry, 1 h later, stops here instead of installing)
          budget=40
          echo "Chicago $h:$mi -> run=$run budget=$budget min"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Playwright browser
        if: steps.slot.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install OCR + packages
        if: steps.slot.outputs.run == 'true'
        run: |
          # Retries: a short network / mirror outage on the GitHub runner used to fail the whole run (exit code 100).
          for i in 1 2 3 4 5; do
            timeout 240 sudo apt-get update -qq -o Acquire::Retries=3 \
              && timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=3 tesseract-ocr > /dev/null && break
            echo "apt-get failed (try $i of 5), retrying in 30 s"; sleep 30
          done
          command -v tesseract > /dev/null || { echo "::error::tesseract could not be installed (network problem on the GitHub runner)"; exit 1; }
          for i in 1 2 3; do pip install -q -r requirements.txt && break; echo "pip failed (try $i of 3)"; sleep 20; done
          for i in 1 2 3; do python -m playwright install --with-deps chromium > /dev/null && break; echo "playwright install failed (try $i of 3)"; sleep 30; done
      - name: Scrape
        if: steps.slot.outputs.run == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          DAYS_BACK: ${{ inputs.days_back || '0' }}
          BUDGET_MIN: ${{ inputs.budget_min || steps.slot.outputs.budget || '40' }}
        run: python -m scraper.main
