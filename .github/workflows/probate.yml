name: Daily probate (County Clerk records + probate courts)

on:
  # Every day ~11:07pm Chicago (05:07 UTC: 11:07pm CST / 12:07am CDT): after the 7pm foreclosure scrape and done
  # before the 1am full catch-up run. Runs that write the same sheet must not overlap (the tax roll deletes rows).
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "write = add new rows; count = read and print only (nothing written)"
        default: "write"
      days:
        description: "Days to look back"
        default: "14"
      counties:
        description: "Comma list (blank = Collin,Denton,Dallas,Tarrant)"
        default: ""

concurrency:
  group: probate
  cancel-in-progress: false

jobs:
  probate:
    # Pinned like scrape.yml: ubuntu-latest moved to Ubuntu 26 in Oct 2026 and its package mirrors failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install packages
        # Time limits + retries: a download that hangs used to keep the job waiting until the 60-min timeout.
        run: |
          for i in 1 2 3; do timeout 300 pip install -q -r requirements.txt && break; echo "pip failed (try $i of 3)"; sleep 20; done
          for i in 1 2 3; do timeout 420 python -m playwright install --with-deps chromium > /dev/null && break; echo "playwright install failed or hung (try $i of 3)"; sleep 30; done
          python -c "import playwright" || { echo "::error::packages could not be installed"; exit 1; }
      - name: Probate
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PROBATE_MODE: ${{ github.event_name == 'schedule' && 'write' || inputs.mode || 'write' }}
          PROBATE_DAYS: ${{ inputs.days || '14' }}
          PROBATE_COUNTIES: ${{ inputs.counties || '' }}
        run: python -m scraper.probate
