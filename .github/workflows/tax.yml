name: Weekly tax roll (Tax Lawsuit / Tax Delinquent)

on:
  # Every night ~9:17pm Chicago (03:17 UTC: 9:17pm CST / 10:17pm CDT): after the 7pm foreclosure scrape, before
  # probate (~11pm) and the 1am full run. The counties post new rolls on different days (Tarrant Friday, Dallas
  # Monday), so a daily run picks each one up the next night. Accounts already in a tab are skipped, and an account
  # is archived only after missing on two runs at least 5 days apart (ARCH_MIN_DAYS), so daily runs are safe.
  # It archives paid accounts by deleting rows, so it must never run at the same time as the other scrapers.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "write = add new rows; count = parse and count only (nothing written)"
        default: "write"
      counties:
        description: "Comma list (blank = Collin,Denton,Dallas,Tarrant)"
        default: ""

concurrency:
  group: taxroll
  cancel-in-progress: false

jobs:
  taxroll:
    # Pinned like scrape.yml: ubuntu-latest moved to Ubuntu 26 in Oct 2026 and its package mirrors failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          for i in 1 2 3; do timeout 300 pip install -q -r requirements.txt && break; echo "pip failed (try $i of 3)"; sleep 20; done
      - name: Tax roll
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TAX_MODE: ${{ github.event_name == 'schedule' && 'write' || inputs.mode || 'write' }}
          TAX_COUNTIES: ${{ inputs.counties || '' }}
        run: python -m scraper.tax
