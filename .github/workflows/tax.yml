name: Daily tax roll (Tax Lawsuit / Tax Delinquent)

on:
  # Check daily for newly published county rolls. The Sheets writer is shared across workflows.
  schedule:
    - cron: "17 21 * * *"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: "write = add new rows; count = parse and count only (nothing written)"
        default: "write"
      counties:
        description: "Comma list (blank = Collin,Denton,Dallas,Tarrant)"
        default: ""

concurrency:
  group: county-leads-sheet-writer
  queue: max

jobs:
  taxroll:
    # Pinned like scrape.yml: ubuntu-latest moved to Ubuntu 26 in Oct 2026 and its package mirrors failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          for i in 1 2 3; do timeout 300 pip install -q -r requirements.txt && break; echo "pip failed (try $i of 3)"; sleep 20; done
      - name: Tax roll
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TAX_MODE: ${{ github.event_name == 'schedule' && 'write' || inputs.mode || 'write' }}
          TAX_COUNTIES: ${{ inputs.counties || '' }}
        run: python -m scraper.tax
